name: Validate climate investment workflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate software, release inventory and research examples
        run: python scripts/validate_repository.py --out runs/ci-validation

      - name: Archive validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.python-version || matrix.python }}
          path: runs/ci-validation
          if-no-files-found: error
